name: python

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[http]" pytest ruff pyright
      - name: ruff
        run: uv run ruff check .
      - name: pyright
        run: uv run pyright
      - name: pytest
        run: uv run pytest -q

  cleanroom:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: build wheel
        run: uv build
      - name: install the built wheel into an empty env and run the CLI
        run: |
          uv venv --clear /tmp/cr
          VIRTUAL_ENV=/tmp/cr uv pip install dist/*.whl
          FX="$PWD/tests/fixtures"
          /tmp/cr/bin/govdrift scan \
            --inventory "$FX/inventory_approved.yaml" \
            --foundry   "$FX/foundry_models.json" \
            --tenant    "$FX/tenant_observed.json" \
            --out /tmp/cr-out --today 2026-08-16 && { echo "expected exit 1 (drift found)"; exit 1; } || true
          test -f /tmp/cr-out/findings.sarif
          python3 -c "import json,sys; d=json.load(open('/tmp/cr-out/findings.sarif')); assert d['version']=='2.1.0'; assert len(d['runs'][0]['results'])==2; print('SARIF OK')"

  publish:
    # Fires only on a v* tag. Requires a PyPI Trusted Publisher configured for this
    # repo + workflow + the "pypi" environment (no stored token). See python/PUBLISHING.md.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, cleanroom]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: publish to PyPI via OIDC (no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
