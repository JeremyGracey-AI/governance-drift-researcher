[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governance-drift"
version = "0.1.0"
description = "Deterministic AI-agent governance drift detection: evidence-backed findings, stated coverage gaps, SARIF output for CI."
readme = "README.md"
requires-python = ">=3.11"          # StrEnum
license = "MIT"
authors = [{ name = "Jeremy Gracey", email = "jeremy.a.gracey@gmail.com" }]
keywords = ["governance", "ai-agents", "drift", "sarif", "compliance", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# Live HTTP sources (Foundry / tenant APIs). The file-based scan needs none of this.
http = ["httpx>=0.27"]

[project.scripts]
govdrift = "governance_drift.cli:main"

[project.urls]
Homepage = "https://github.com/JeremyGracey-AI/governance-drift-researcher"
Repository = "https://github.com/JeremyGracey-AI/governance-drift-researcher"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "httpx>=0.27", "types-pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/governance_drift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
